linux_tool_versions:
  delta: "0.18.2"
  starship: "v1.24.2"
  eza: "v0.23.4"
  ripgrep: "15.1.0"
  bat: "v0.26.1"
  jless: "v0.9.0"
  direnv: "v2.35.0"
  jump: "v0.51.0"

packages:
  darwin:
    brews:
      always:
      - bat
      - btop
      - chezmoi
      - coreutils
      - curl
      - defaultbrowser
      - direnv
      - dockutil
      - exiftool
      - eza
      - fd
      - fish
      - fzf
      - gh
      - git
      - git-delta
      - git-extras
      - git-lfs
      - git-spice
      - herdr
      - jq
      - less
      - libffi
      - mdcat
      - mise
      - mkcert
      - neovim
      - nss
      - openssl
      - pipx
      - ripgrep
      - starship
      - unar
      - vim
      - watch
      - wget
      - xz
      - yazi
      - zellij
      - zoxide
      per_host:
        zaphod:
          - colima
          - docker
          - k9s
          - kubectl
          - kubectx
          - libpq

    casks:
      always:
      - 1Password
      - 1password-cli
      - alt-tab
      - bettertouchtool
      - finicky
      - font-hack-nerd-font
      - font-hasklig
      - font-inconsolata
      - font-input
      - font-jetbrains-mono
      - ghostty
      - google-chrome
      - hammerspoon
      - hiddenbar
      - jetbrains-toolbox
      - karabiner-elements
      - kitty
      - raycast
      - rectangle-pro
      - scroll-reverser
      - shottr
      - terminal-browser
      - visual-studio-code
      linear:
      - ngrok
      per_host:
        zaphod:
          - google-drive
          - obsidian
          - zen

    uv_tools:
      always:
      - httpie
      - pgcli
